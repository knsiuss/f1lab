<!DOCTYPE html>
<!--
  radar_scope.html -- live rain radar for F1 Lab.

  Rendered inside a Streamlit component iframe, styled after replay_player.html
  so the two panels read as one surface. The payload arrives as one JSON blob in
  #payload; nothing here calls back into Streamlit, so panning, zooming and
  stepping through the frames never trigger a page rerun.

  What this is, honestly: a *regional* view of where the rain is around the
  circuit, from RainViewer's free tile set. The free tier stops at zoom 7, so a
  tile is ~190 km wide and the picture answers "is that band of rain coming
  this way", not "is it raining over the pit lane". The frames are observations
  of the last two hours; RainViewer's nowcast layer is empty on the free feed,
  so no forecast is drawn from this picture.

  Tiles are requested by the browser, not the Streamlit server: the Python side
  only fetches the 1.5 KB index document. The dark basemap is OpenStreetMap with
  the standard CSS dark-map filter applied in the browser.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    /* Mirrors the app's design tokens (assets/style.css). */
    --bg: #0B0D12;
    --panel: #12151C;
    --panel-2: #171B24;
    --line: rgba(255,255,255,.08);
    --accent: #E10600;
    --text: #E8EAF0;
    --dim: #9AA1AE;
    --dimmer: #6B7280;
    --good: #3ECF8E;
    --blue: #4C8DFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: Inter, 'Segoe UI', system-ui, sans-serif;
    font-size: 12px;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  #root { display: flex; flex-direction: column; height: 100vh; gap: 8px; padding: 8px; }

  /* ---------- the map ---------- */
  .map {
    position: relative; flex: 1; min-height: 0; overflow: hidden;
    border: 1px solid var(--line); border-radius: 12px;
    background: #0a1018; cursor: grab;
  }
  .map.dragging { cursor: grabbing; }
  .layer { position: absolute; inset: 0; }
  .layer img { position: absolute; width: 256px; height: 256px; border: 0; }
  .layer.basemap img {
    filter: invert(1) hue-rotate(180deg) brightness(.78) contrast(.92) saturate(.55);
  }
  .layer.radar img { opacity: .92; pointer-events: none; }
  .layer.radar { pointer-events: none; }

  #rings { position: absolute; inset: 0; pointer-events: none; }
  #rings circle { fill: none; stroke: rgba(232,234,240,.42); stroke-width: 1; }
  #rings circle.outer { stroke: rgba(232,234,240,.28); }
  #rings text { fill: rgba(232,234,240,.6); font-size: 10px; letter-spacing: .04em; }

  .marker {
    position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px;
    pointer-events: none;
  }
  .marker .dot {
    position: absolute; inset: 2px; border-radius: 50%;
    border: 2px solid var(--accent); background: rgba(225,6,0,.35);
  }
  .marker .cross, .marker .cross:after {
    position: absolute; background: var(--accent); content: '';
  }
  .marker .cross { left: 50%; top: 0; width: 1px; height: 100%; margin-left: -.5px; }
  .marker .cross:after { left: -11px; top: 50%; width: 22px; height: 1px; }

  .hud {
    position: absolute; left: 10px; top: 10px; display: flex; gap: 6px;
    align-items: center; pointer-events: none;
  }
  .pill {
    background: rgba(11,13,18,.82); border: 1px solid var(--line);
    border-radius: 999px; padding: 3px 9px; font-size: 10px;
    letter-spacing: .06em; color: var(--text); backdrop-filter: blur(3px);
  }
  .pill.live { color: var(--good); }
  .pill.stale { color: var(--dim); }
  .pill.place {
    max-width: 58%; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; color: var(--dim);
  }

  .legend {
    position: absolute; right: 10px; top: 72px; display: flex;
    flex-direction: column; gap: 4px; padding: 6px 8px;
    background: rgba(11,13,18,.82); border: 1px solid var(--line);
    border-radius: 8px; font-size: 10px; color: var(--dim);
  }
  .legend .legend-title { color: var(--text); letter-spacing: .06em; }
  .legend .legend-row { display: flex; align-items: center; gap: 6px; }
  .legend .dot { width: 8px; height: 8px; border-radius: 50%; }

  .zoom {
    position: absolute; right: 10px; top: 10px; display: flex;
    flex-direction: column; gap: 4px;
  }
  .zoom button {
    width: 26px; height: 26px; border-radius: 7px; font-size: 14px;
    line-height: 1; background: rgba(11,13,18,.86); color: var(--text);
    border: 1px solid var(--line); cursor: pointer; font-weight: 600;
  }
  .zoom button:hover { border-color: rgba(255,255,255,.24); }
  .zoom button:disabled { color: var(--dimmer); cursor: default; }

  .status {
    position: absolute; inset: 0; display: none; place-items: center;
    text-align: center; padding: 24px; color: var(--dim); font-size: 12px;
    background: rgba(11,13,18,.6);
  }
  .status.show { display: grid; }

  /* ---------- the timeline ---------- */
  .bar {
    display: flex; align-items: center; gap: 10px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 7px 10px;
  }
  .bar button {
    display: inline-flex; align-items: center; justify-content: center;
    height: 26px; min-width: 30px; padding: 0 9px; border-radius: 7px;
    background: var(--panel-2); color: var(--text); cursor: pointer;
    border: 1px solid var(--line); font: inherit; font-weight: 600;
    letter-spacing: .04em;
  }
  .bar button:hover { border-color: rgba(255,255,255,.24); }
  .bar button.primary { border-color: rgba(225,6,0,.55); color: #ff8a84; }
  .stamp { font-variant-numeric: tabular-nums; color: var(--text); min-width: 74px; }
  .stamp .utc { color: var(--dimmer); font-size: 10px; letter-spacing: .08em; }
  .age { color: var(--dim); font-size: 11px; min-width: 62px; }

  input[type=range] {
    flex: 1; -webkit-appearance: none; appearance: none; height: 4px;
    border-radius: 999px; background: rgba(255,255,255,.12); outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%;
    background: var(--accent); border: 2px solid var(--panel); cursor: pointer;
  }
  input[type=range]::-moz-range-thumb {
    width: 13px; height: 13px; border-radius: 50%; background: var(--accent);
    border: 2px solid var(--panel); cursor: pointer;
  }

  /* ---------- the footer ---------- */
  .foot {
    display: flex; align-items: center; gap: 6px; justify-content: space-between;
    color: var(--dimmer); font-size: 10px; padding: 0 2px;
  }
  .foot a { color: var(--dim); text-decoration: none; border-bottom: 1px dotted rgba(154,161,174,.5); }
  .foot a:hover { color: var(--text); }
  .foot .hint { color: var(--dimmer); }
</style>
</head>
<body>
<div id="root">
  <div class="map" id="map" tabindex="0" aria-label="Rain radar around the circuit">
    <div class="layer basemap" id="basemap"></div>
    <div class="layer radar" id="radar"></div>
    <svg id="rings" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="marker" id="marker"><span class="cross"></span><span class="dot"></span></div>
    <div class="hud">
      <span class="pill place" id="place"></span>
      <span class="pill live" id="pill">LIVE</span>
      <span class="pill" id="zoomPill">zoom 6</span>
    </div>
    <div class="zoom">
      <button type="button" id="zoomIn" aria-label="Zoom in">+</button>
      <button type="button" id="zoomOut" aria-label="Zoom out">&minus;</button>
    </div>
    <div class="legend" aria-label="Rain intensity legend">
      <span class="legend-title">Rain intensity</span>
      <span class="legend-row"><span class="dot" style="background:#e10600"></span>Heavy</span>
      <span class="legend-row"><span class="dot" style="background:#f2d16b"></span>Moderate</span>
      <span class="legend-row"><span class="dot" style="background:#38bdf8"></span>Light</span>
    </div>
    <div class="status" id="status"></div>
  </div>

  <div class="bar">
    <button type="button" class="primary" id="play" aria-label="Play the frames">Play</button>
    <input type="range" id="scrub" min="0" value="0" step="1" aria-label="Radar frame">
    <span class="stamp"><span id="time">--:--</span> <span class="utc">UTC</span></span>
    <span class="age" id="age"></span>
  </div>

  <div class="foot">
    <span id="credit"></span>
    <span class="hint" id="coverage"></span>
  </div>
</div>

<script id="payload" type="application/json">__PAYLOAD__</script>
<script>
(function () {
  'use strict';

  var DATA = JSON.parse(document.getElementById('payload').textContent || '{}');
  var TILE = DATA.tile_size || 256;
  var FRAMES = Array.isArray(DATA.frames) ? DATA.frames : [];
  var RINGS = Array.isArray(DATA.rings_km) ? DATA.rings_km : [50, 100, 200];
  var MIN_Z = DATA.min_zoom || 4;
  var MAX_Z = DATA.max_zoom || 7;
  var COLOR = DATA.color_scheme || 4;
  var OPTIONS = DATA.options || '1_1';
  var HOST = String(DATA.host || '');
  var CENTER = DATA.center || null;

  var mapEl = document.getElementById('map');
  var baseEl = document.getElementById('basemap');
  var radarEl = document.getElementById('radar');
  var ringsEl = document.getElementById('rings');
  var markerEl = document.getElementById('marker');
  var statusEl = document.getElementById('status');
  var pillEl = document.getElementById('pill');
  var placeEl = document.getElementById('place');
  var zoomPill = document.getElementById('zoomPill');
  var playEl = document.getElementById('play');
  var scrubEl = document.getElementById('scrub');
  var timeEl = document.getElementById('time');
  var ageEl = document.getElementById('age');
  var creditEl = document.getElementById('credit');
  var coverageEl = document.getElementById('coverage');

  // Escaping: frame paths come from a third-party API, so they never reach the
  // DOM as raw text.
  function esc(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  var state = {
    zoom: Math.min(Math.max(DATA.zoom || 6, MIN_Z), MAX_Z),
    lat: CENTER ? CENTER.lat : 0,
    lon: CENTER ? CENTER.lon : 0,
    frame: Math.max(0, FRAMES.length - 1),
    playing: false,
    timer: null,
    ready: false
  };

  // ---- Web Mercator, in world pixels ---------------------------------------
  function scaleFor(zoom) { return TILE * Math.pow(2, zoom); }

  function worldPx(lat, lon, zoom) {
    var scale = scaleFor(zoom);
    var rad = lat * Math.PI / 180;
    return {
      x: (lon + 180) / 360 * scale,
      y: (1 - Math.log(Math.tan(rad) + 1 / Math.cos(rad)) / Math.PI) / 2 * scale
    };
  }

  function latFromY(y, zoom) {
    var n = Math.PI - 2 * Math.PI * y / scaleFor(zoom);
    return 180 / Math.PI * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n)));
  }

  function metresPerPixel(zoom, lat) {
    return 156543.03392 * Math.cos(lat * Math.PI / 180) / Math.pow(2, zoom);
  }

  function clampLat(lat) { return Math.max(-85, Math.min(85, lat)); }

  function wrapLon(lon) {
    var value = lon;
    while (value > 180) { value -= 360; }
    while (value < -180) { value += 360; }
    return value;
  }

  function frameUrl(frame) {
    return HOST + String(frame.path || '') + '/' + TILE + '/' + state.zoom +
      '/{x}/{y}/' + COLOR + '/' + OPTIONS + '.png';
  }

  // ---- tiles ---------------------------------------------------------------
  function tileList(width, height) {
    var scale = scaleFor(state.zoom);
    var max = Math.pow(2, state.zoom);
    var centre = worldPx(state.lat, state.lon, state.zoom);
    var originX = centre.x - width / 2;
    var originY = centre.y - height / 2;
    var x0 = Math.floor(originX / TILE), x1 = Math.floor((originX + width) / TILE);
    var y0 = Math.max(0, Math.floor(originY / TILE));
    var y1 = Math.min(max - 1, Math.floor((originY + height) / TILE));
    var tiles = [];
    for (var x = x0; x <= x1; x++) {
      var tx = ((x % max) + max) % max;
      for (var y = y0; y <= y1; y++) {
        tiles.push({
          x: tx, y: y,
          left: Math.round(x * TILE - originX),
          top: Math.round(y * TILE - originY)
        });
      }
    }
    return { tiles: tiles, originX: originX, originY: originY, scale: scale };
  }

  function drawTiles(layer, tiles, template) {
    var html = [];
    for (var i = 0; i < tiles.length; i++) {
      var tile = tiles[i];
      var url = template.replace('{z}', state.zoom)
        .replace('{x}', tile.x).replace('{y}', tile.y);
      html.push('<img alt="" loading="lazy" src="' + esc(url) +
        '" style="left:' + tile.left + 'px;top:' + tile.top + 'px"' +
        ' onerror="this.style.visibility=\'hidden\'">');
    }
    layer.innerHTML = html.join('');
  }

  // ---- rings and marker ----------------------------------------------------
  var SVG_NS = 'http://www.w3.org/2000/svg';

  function drawRings(width, height, originX, originY) {
    var centre = worldPx(state.lat, state.lon, state.zoom);
    var sx = centre.x - originX, sy = centre.y - originY;
    var mpp = metresPerPixel(state.zoom, state.lat);

    while (ringsEl.firstChild) { ringsEl.removeChild(ringsEl.firstChild); }
    ringsEl.setAttribute('viewBox', '0 0 ' + width + ' ' + height);
    ringsEl.setAttribute('width', width);
    ringsEl.setAttribute('height', height);

    for (var i = 0; i < RINGS.length; i++) {
      var km = RINGS[i];
      var r = km * 1000 / mpp;
      if (!(r > 4 && r < Math.max(width, height) * 1.6)) { continue; }
      var circle = document.createElementNS(SVG_NS, 'circle');
      circle.setAttribute('cx', sx.toFixed(1));
      circle.setAttribute('cy', sy.toFixed(1));
      circle.setAttribute('r', r.toFixed(1));
      if (km === RINGS[RINGS.length - 1]) { circle.setAttribute('class', 'outer'); }
      ringsEl.appendChild(circle);

      if (r < Math.min(width, height) / 2 - 10 || km === RINGS[0]) {
        var label = document.createElementNS(SVG_NS, 'text');
        label.setAttribute('x', (sx + r * 0.7071 + 3).toFixed(1));
        label.setAttribute('y', (sy - r * 0.7071 - 3).toFixed(1));
        label.textContent = km + ' km';
        ringsEl.appendChild(label);
      }
    }

    markerEl.style.left = sx + 'px';
    markerEl.style.top = sy + 'px';
  }

  // ---- the frame timeline --------------------------------------------------
  function currentFrame() {
    return FRAMES.length ? FRAMES[Math.min(state.frame, FRAMES.length - 1)] : null;
  }

  function pad(value) { return (value < 10 ? '0' : '') + value; }

  function frameClock(frame) {
    var when = new Date(frame.time * 1000);
    return pad(when.getUTCHours()) + ':' + pad(when.getUTCMinutes());
  }

  function frameAge(frame) {
    var minutes = Math.round((Date.now() / 1000 - frame.time) / 60);
    if (minutes <= 0) { return 'just now'; }
    if (minutes < 60) { return minutes + ' min ago'; }
    var hours = Math.floor(minutes / 60);
    return hours + ' h ' + (minutes % 60) + ' min ago';
  }

  function updateTime() {
    var frame = currentFrame();
    if (!frame) {
      timeEl.textContent = '--:--';
      ageEl.textContent = '';
      return;
    }
    timeEl.textContent = frameClock(frame);
    ageEl.textContent = frameAge(frame);
    var latest = FRAMES[FRAMES.length - 1];
    var minutes = Math.round((Date.now() / 1000 - latest.time) / 60);
    var fresh = minutes <= 15;
    pillEl.textContent = fresh ? 'LIVE' : 'LATEST ' + minutes + ' MIN';
    pillEl.className = 'pill ' + (fresh ? 'live' : 'stale');
  }

  function drawRadar() {
    var frame = currentFrame();
    if (!frame || !HOST) { return; }
    var box = tileList(mapEl.clientWidth, mapEl.clientHeight);
    drawTiles(radarEl, box.tiles, frameUrl(frame));
  }

  // ---- the whole picture ---------------------------------------------------
  function render() {
    var width = mapEl.clientWidth, height = mapEl.clientHeight;
    if (!width || !height) { return; }

    var box = tileList(width, height);
    drawTiles(baseEl, box.tiles, 'https://tile.openstreetmap.org/{z}/{x}/{y}.png');
    drawRadar();
    drawRings(width, height, box.originX, box.originY);

    zoomPill.textContent = 'zoom ' + state.zoom;
    document.getElementById('zoomIn').disabled = state.zoom >= MAX_Z;
    document.getElementById('zoomOut').disabled = state.zoom <= MIN_Z;
    updateTime();
  }

  // Fit the outermost ring in the viewport on the first paint, so the panel
  // opens on the scale it is about: the 200 km ring visible.
  function fitZoom() {
    var width = mapEl.clientWidth, height = mapEl.clientHeight;
    var limit = Math.min(width, height) / 2 - 18;
    var outer = RINGS[RINGS.length - 1];
    for (var zoom = MAX_Z; zoom >= MIN_Z; zoom--) {
      var mpp = metresPerPixel(zoom, state.lat);
      if (outer * 1000 / mpp <= limit) { return zoom; }
    }
    return MIN_Z;
  }

  // ---- interaction ---------------------------------------------------------
  var drag = null;
  var pending = false;

  function schedule() {
    if (pending) { return; }
    pending = true;
    window.requestAnimationFrame(function () {
      pending = false;
      render();
    });
  }

  mapEl.addEventListener('pointerdown', function (event) {
    if (event.target.closest('button')) { return; }
    drag = { x: event.clientX, y: event.clientY, lat: state.lat, lon: state.lon };
    mapEl.classList.add('dragging');
    mapEl.setPointerCapture(event.pointerId);
  });

  mapEl.addEventListener('pointermove', function (event) {
    if (!drag) { return; }
    var mpp = metresPerPixel(state.zoom, drag.lat);
    var scale = scaleFor(state.zoom);
    state.lon = wrapLon(drag.lon - (event.clientX - drag.x) * 360 / scale);
    state.lat = clampLat(latFromY(
      worldPx(drag.lat, drag.lon, state.zoom).y - (event.clientY - drag.y),
      state.zoom));
    schedule();
  });

  function endDrag() {
    if (!drag) { return; }
    drag = null;
    mapEl.classList.remove('dragging');
  }

  mapEl.addEventListener('pointerup', endDrag);
  mapEl.addEventListener('pointercancel', endDrag);

  function zoomBy(delta, anchorEvent) {
    var next = Math.min(Math.max(state.zoom + delta, MIN_Z), MAX_Z);
    if (next === state.zoom) { return; }

    var rect = mapEl.getBoundingClientRect();
    var px = 0, py = 0;
    if (anchorEvent) {
      px = anchorEvent.clientX - rect.left - mapEl.clientWidth / 2;
      py = anchorEvent.clientY - rect.top - mapEl.clientHeight / 2;
    }
    // The world pixel under the anchor, at the old zoom, scaled to the new one.
    var before = worldPx(state.lat, state.lon, state.zoom);
    var factor = Math.pow(2, next - state.zoom);
    var anchorX = (before.x + px) * factor;
    var anchorY = (before.y + py) * factor;

    state.zoom = next;
    var centreX = anchorX - px;
    var centreY = anchorY - py;
    state.lon = wrapLon(centreX / scaleFor(state.zoom) * 360 - 180);
    state.lat = clampLat(latFromY(centreY, state.zoom));
    render();
  }

  document.getElementById('zoomIn').addEventListener('click', function () { zoomBy(1); });
  document.getElementById('zoomOut').addEventListener('click', function () { zoomBy(-1); });

  mapEl.addEventListener('wheel', function (event) {
    event.preventDefault();
    zoomBy(event.deltaY < 0 ? 1 : -1, event);
  }, { passive: false });

  mapEl.addEventListener('keydown', function (event) {
    var step = 80;
    var keys = { ArrowLeft: [-step, 0], ArrowRight: [step, 0],
                 ArrowUp: [0, -step], ArrowDown: [0, step] };
    var move = keys[event.key];
    if (!move) { return; }
    event.preventDefault();
    var centre = worldPx(state.lat, state.lon, state.zoom);
    state.lat = clampLat(latFromY(centre.y + move[1], state.zoom));
    state.lon = wrapLon((centre.x + move[0]) / scaleFor(state.zoom) * 360 - 180);
    render();
  });

  // ---- frame controls ------------------------------------------------------
  function showFrame(index) {
    if (!FRAMES.length) { return; }
    var count = FRAMES.length;
    state.frame = ((index % count) + count) % count;
    scrubEl.value = String(state.frame);
    drawRadar();
    updateTime();
  }

  function stopPlayback() {
    state.playing = false;
    if (state.timer) {
      window.clearInterval(state.timer);
      state.timer = null;
    }
    playEl.textContent = 'Play';
    playEl.classList.add('primary');
  }

  function startPlayback() {
    if (FRAMES.length < 2) { return; }
    state.playing = true;
    playEl.textContent = 'Pause';
    playEl.classList.remove('primary');
    showFrame(0);
    state.timer = window.setInterval(function () {
      if (!state.playing) { return; }
      showFrame(state.frame + 1);
    }, 650);
  }

  playEl.addEventListener('click', function () {
    if (state.playing) { stopPlayback(); } else { startPlayback(); }
  });

  scrubEl.addEventListener('input', function () {
    stopPlayback();
    showFrame(parseInt(scrubEl.value, 10) || 0);
  });

  window.addEventListener('resize', function () { render(); });

  // ---- boot ----------------------------------------------------------------
  function fail(message) {
    statusEl.textContent = message;
    statusEl.classList.add('show');
  }

  creditEl.innerHTML =
    '<a href="' + esc(DATA.attribution_url || '') + '" target="_blank" ' +
    'rel="noopener">' + esc(DATA.attribution || 'RainViewer') + '</a> · ' +
    '&copy; <a href="' + esc(DATA.basemap_attribution_url || '') +
    '" target="_blank" rel="noopener">' +
    esc(DATA.basemap_attribution || 'OpenStreetMap') + '</a>';

  if (!CENTER || !FRAMES.length || !HOST) {
    fail('The radar service did not return a frame, so there is nothing to draw.');
    return;
  }

  // The circuit the view is centred on, so the map can never be mistaken for
  // somewhere else.
  if (DATA.track_name) { placeEl.textContent = String(DATA.track_name); }

  scrubEl.max = String(FRAMES.length - 1);
  state.frame = FRAMES.length - 1;
  scrubEl.value = String(state.frame);

  window.requestAnimationFrame(function () {
    state.zoom = fitZoom();
    var km = Math.round(metresPerPixel(state.zoom, state.lat) *
      Math.min(mapEl.clientWidth, mapEl.clientHeight) / 1000);
    coverageEl.textContent = 'regional view, about ' + km + ' km across';
    if (FRAMES.length < 2) { playEl.disabled = true; }
    render();
  });
})();
</script>
</body>
</html>
