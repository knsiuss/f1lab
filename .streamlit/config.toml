[theme]
base = "dark"
primaryColor = "#E10600"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#1a1a2e"
textColor = "#FFFFFF"
font = "sans serif"

[client]
toolbarMode = "minimal"
showErrorDetails = false

[browser]
gatherUsageStats = false

[server]
port = 8501
maxUploadSize = 200
maxMessageSize = 200
headless = true
# enableCORS = false only works together with enableXsrfProtection = false;
# Streamlit overrides CORS back to true otherwise, so the pair was removed
# instead of leaving two options that silently disagree.
enableXsrfProtection = true
