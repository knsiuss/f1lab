[theme]
base = "dark"
primaryColor = "#D6F84C"
backgroundColor = "#08080C"
secondaryBackgroundColor = "#0E0E14"
textColor = "#F4F6F8"
font = "sans serif"

[client]
toolbarMode = "minimal"
showErrorDetails = false

[browser]
gatherUsageStats = false

[server]
port = 8501
maxUploadSize = 200
maxMessageSize = 200
headless = true
enableXsrfProtection = true
