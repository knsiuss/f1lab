# Render blueprint for F1 Lab (https://render.com/docs/blueprint-spec)
#
#   Render dashboard -> New -> Blueprint -> pick this repository
#
# The app is a single Streamlit process, so one web service is enough. The
# health check path is Streamlit's own /_stcore/health endpoint, which returns
# 200 only once the server is accepting sessions.
services:
  - type: web
    name: f1lab
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /_stcore/health
    autoDeploy: true
    envVars:
      # The cache lives on a mount when one exists (see the commented disk
      # below). On the free plan the filesystem is ephemeral, so a restart
      # re-downloads the season from OpenF1: correct, just slower (~2 min).
      - key: F1LAB_CACHE_DIR
        value: /data/f1_cache
      - key: STREAMLIT_SERVER_HEADLESS
        value: "true"
      - key: STREAMLIT_BROWSER_GATHER_USAGE_STATS
        value: "false"
      - key: PYTHONUNBUFFERED
        value: "1"
    # Disks need a paid instance type on Render. Uncomment both lines (and
    # switch plan to starter) to keep the OpenF1 cache between restarts.
    # disk:
    #   name: f1lab-cache
    #   mountPath: /data
    #   sizeGB: 1
